services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000:10000"
    volumes:
      - ./azurite-data:/data
    command: azurite --blobHost 0.0.0.0 --location /data --skipApiVersionCheck

  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    ports:
      - "8081:8081" # cosmos gateway (http)
      - "8080:8080" # health probe
      - "1234:1234" # data explorer
    volumes:
      - ./cosmos-data:/data
